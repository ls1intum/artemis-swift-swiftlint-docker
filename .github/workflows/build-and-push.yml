name: Build and Push

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
    tags: '*'
  release:
    types:
      - created

env:
  SWIFT_VERSION: "6.2"
  SWIFTLINT_VERSION: "0.63.1"

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    name: Build and Push the Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Compute Tag
        uses: actions/github-script@v7
        id: compute-tag
        with:
          result-encoding: string
          script: |
            if (context.eventName === "pull_request") {
              return "pr-" + context.issue.number;
            }
            if (context.eventName === "push") {
              if (context.ref.startsWith("refs/tags/")) {
                return context.ref.slice(10);
              }
              if (context.ref === "refs/heads/main") {
                return "latest";
              }
            }
            return "FALSE";

      - uses: actions/checkout@v4

      - name: Docker Login
        run: |
          docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image and Push
        uses: docker/build-push-action@v6
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' }}
        with:
          context: .
          build-args: |
            SWIFT_IMAGE=swift:${{ env.SWIFT_VERSION }}-noble
            SWIFTLINT_VERSION=${{ env.SWIFTLINT_VERSION }}
          tags: |
            ls1tum/artemis-swift-swiftlint-docker:swift${{ env.SWIFT_VERSION }}
            ls1tum/artemis-swift-swiftlint-docker:${{ steps.compute-tag.outputs.result }}
            ghcr.io/ls1intum/artemis-swift-swiftlint-docker:swift${{ env.SWIFT_VERSION }}
            ghcr.io/ls1intum/artemis-swift-swiftlint-docker:${{ steps.compute-tag.outputs.result }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
